<h1>Categorías</h1>

@if (cargando()) {
  <div class="centro"><mat-spinner /></div>
} @else {
  <div class="crear">
    <mat-form-field appearance="outline">
      <mat-label>Nueva categoría</mat-label>
      <input matInput [(ngModel)]="nueva" name="nueva" (keyup.enter)="crear()" />
    </mat-form-field>
    <button mat-flat-button color="primary" (click)="crear()">
      <mat-icon>add</mat-icon>
      Crear
    </button>
  </div>

  <mat-card>
    <table mat-table [dataSource]="categorias()">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let c">{{ c.id }}</td>
      </ng-container>
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let c">{{ c.nombre }}</td>
      </ng-container>
      <ng-container matColumnDef="accion">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let c">
          <button mat-icon-button (click)="editar(c)" aria-label="Editar categoría">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="eliminar(c)" aria-label="Eliminar categoría">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    </table>
    @if (categorias().length === 0) {
      <p class="sin-datos">No hay categorías.</p>
    }
  </mat-card>
}
