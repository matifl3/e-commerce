<h1>Colores</h1>

@if (cargando()) {
  <div class="centro"><mat-spinner /></div>
} @else {
  <div class="crear">
    <mat-form-field appearance="outline">
      <mat-label>Nuevo color</mat-label>
      <input matInput [(ngModel)]="nombre" name="nombre" (keyup.enter)="crear()" />
    </mat-form-field>
    <input type="color" [(ngModel)]="hex" name="hex" class="swatch-input" />
    <button mat-flat-button color="primary" (click)="crear()">
      <mat-icon>add</mat-icon>
      Crear
    </button>
  </div>

  <mat-card>
    <table mat-table [dataSource]="colores()">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let c">{{ c.id }}</td>
      </ng-container>
      <ng-container matColumnDef="swatch">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let c">
          <span class="swatch" [style.background]="c.codigoHex || '#888'"></span>
        </td>
      </ng-container>
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let c">{{ c.nombre }}</td>
      </ng-container>
      <ng-container matColumnDef="hex">
        <th mat-header-cell *matHeaderCellDef>Hex</th>
        <td mat-cell *matCellDef="let c">{{ c.codigoHex ?? '-' }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    </table>
    @if (colores().length === 0) {
      <p class="sin-datos">No hay colores.</p>
    }
  </mat-card>
}
