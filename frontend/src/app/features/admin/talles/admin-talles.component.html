<h1>Talles</h1>

@if (cargando()) {
  <div class="centro"><mat-spinner /></div>
} @else {
  <div class="crear">
    <mat-form-field appearance="outline">
      <mat-label>Nuevo talle</mat-label>
      <input matInput [(ngModel)]="nombre" name="nombre" (keyup.enter)="crear()" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="orden">
      <mat-label>Orden</mat-label>
      <input matInput type="number" [(ngModel)]="orden" name="orden" />
    </mat-form-field>
    <button mat-flat-button color="primary" (click)="crear()">
      <mat-icon>add</mat-icon>
      Crear
    </button>
  </div>

  <mat-card>
    <table mat-table [dataSource]="talles()">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let t">{{ t.id }}</td>
      </ng-container>
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let t">{{ t.nombre }}</td>
      </ng-container>
      <ng-container matColumnDef="orden">
        <th mat-header-cell *matHeaderCellDef>Orden</th>
        <td mat-cell *matCellDef="let t">{{ t.orden ?? '-' }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    </table>
    @if (talles().length === 0) {
      <p class="sin-datos">No hay talles.</p>
    }
  </mat-card>
}
