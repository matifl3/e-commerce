<div class="encabezado">
  <h1>Mis pedidos</h1>
</div>

@if (cargando()) {
  <div class="centro"><mat-spinner /></div>
} @else if (pedidos().length === 0) {
  <mat-card class="vacio">
    <p>Aún no hiciste pedidos.</p>
    <button mat-flat-button color="primary" routerLink="/">Ir a la tienda</button>
  </mat-card>
} @else {
  <mat-card>
    <table mat-table [dataSource]="pedidos()">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>N°</th>
        <td mat-cell *matCellDef="let p">#{{ p.id }}</td>
      </ng-container>
      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let p">{{ formatFecha(p.fechaPedido) }}</td>
      </ng-container>
      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let p">{{ formatPeso(p.total) }}</td>
      </ng-container>
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let p">
          <span [class]="'chip ' + p.estado.toLowerCase()">{{ p.estado }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="accion">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let p">
          <button mat-icon-button [routerLink]="['/pedidos', p.id]" aria-label="Ver pedido">
            <mat-icon>chevron_right</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    </table>
  </mat-card>
}
