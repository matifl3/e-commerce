spring.application.name=malaquita

# ===================== Database (MySQL) =====================
spring.datasource.url=jdbc:mysql://localhost:3306/malaquita?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / Hibernate =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================== Jackson / Dates =====================
# Spring Boot 4 usa Jackson 3 (tools.jackson): las fechas se serializan en ISO-8601 por defecto.

# ===================== Seguridad / JWT =====================
app.jwt.secret=${JWT_SECRET:malaquita-secreto-jwt-super-seguro-para-firmar-tokens-en-firma-hs256}
app.jwt.expiration-ms=86400000

# ===================== Carrito =====================
app.carrito.abandonado-dias=7
